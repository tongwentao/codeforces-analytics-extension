<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CF Analytics</title>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      color: #333;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #1f8ecd;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      margin-top: 10px;
      padding: 10px;
      background-color: #1f8ecd;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #166b9e;
    }
    .btn-secondary {
      background-color: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-secondary:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h3 data-i18n="popupTitle">CF Analytics</h3>
  <p data-i18n="popupDesc">This extension is active! Please visit a Codeforces profile page to view the analytics charts.</p>
  
  <a href="https://codeforces.com" target="_blank" class="btn btn-secondary" data-i18n="btnGoToCF">Go to Codeforces</a>
  <a href="https://codeforces.com/profile/tongwentao" target="_blank" class="btn" data-i18n="btnViewDemo">View Demo</a>

  <script src="popup.js"></script>
</body>
</html>
